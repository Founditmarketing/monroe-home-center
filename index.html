
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monroe Home Center | Louisiana Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #ffffff;
        overflow-x: hidden;
      }
      .font-oswald { font-family: 'Oswald', sans-serif; }
      
      @keyframes neon-pulse {
        0%, 100% { 
          box-shadow: 0 0 20px rgba(239, 68, 68, 0.4), inset 0 0 10px rgba(239, 68, 68, 0.2);
          transform: scale(1);
        }
        50% { 
          box-shadow: 0 0 45px rgba(239, 68, 68, 0.9), inset 0 0 20px rgba(239, 68, 68, 0.4);
          transform: scale(1.02);
        }
      }
      .animate-neon-pulse {
        animation: neon-pulse 1.8s infinite ease-in-out;
      }

      @keyframes float-hero {
        0%, 100% { transform: translateY(0) rotate(0); }
        33% { transform: translateY(-30px) rotate(2deg); }
        66% { transform: translateY(-15px) rotate(-1deg); }
      }
      .animate-float-hero {
        animation: float-hero 8s infinite ease-in-out;
      }

      .text-shatter {
        background: linear-gradient(
          to bottom,
          #ffffff 0%,
          #f3f4f6 15%,
          #d1d5db 30%,
          #9ca3af 45%,
          #4b5563 60%,
          #1f2937 75%,
          #111827 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 15px 30px rgba(0,0,0,0.9));
        letter-spacing: -0.07em;
        position: relative;
        display: inline-block;
      }

      .glass-morphism {
        background: rgba(255, 255, 255, 0.01);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .inventory-card:hover .card-overlay {
        opacity: 0.9;
      }
      
      .inventory-card:hover .card-img {
        transform: scale(1.1);
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ef4444;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "recharts": "https://esm.sh/recharts@^3.7.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
